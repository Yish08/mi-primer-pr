name: CI - Backend & Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Install & Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecommerce-api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  test-frontend:
    name: Install & Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ecommerce-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ecommerce-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Run Cypress E2E tests
        run: |
          BROWSER=none npm start &
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
              echo "Servidor frontend listo en http://localhost:3000"
              break
            fi
            sleep 2
          done
          npm run cy:run
        env:
          CI: true
